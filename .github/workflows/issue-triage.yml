# Triage new issues with Claude (tools/triage/triage.py, Claude API).
# Reporters only need a GitHub account. Authentication is workload identity federation: no API key is
# stored. The federation IDs below (rule vassalmodule-issue-triage, service account github-triage, workspace
# GitHub triage) are identifiers, not secrets; repository/organisation variables of the same name override
# them. Optional variables: TRIAGE_PRODUCT, TRIAGE_MODEL.
#
# Mode (repository variable TRIAGE_MODE):
#   comment (default) - post one triage comment only
#   label             - also add labels from the existing label set
#
# Runs when an issue is opened, when the label "triage" is added (to re-run), or by hand (Actions tab).
name: Issue triage

on:
  issues:
    types: [opened, labeled]
  workflow_dispatch:
    inputs:
      issue:
        description: Issue number to triage
        required: true

permissions:
  contents: read
  issues: write
  id-token: write

concurrency:
  group: triage-${{ github.event.issue.number || inputs.issue }}
  cancel-in-progress: false

jobs:
  triage:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.action == 'opened' && github.event.issue.user.login != github.repository_owner && github.event.issue.user.login != 'riverwanderer') ||
      (github.event.action == 'labeled' && github.event.label.name == 'triage')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ISSUE: ${{ github.event.issue.number || inputs.issue }}
      TRIAGE_MODE: ${{ vars.TRIAGE_MODE || 'comment' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: tools/triage

      - name: Download attachments
        run: |
          mkdir -p /tmp/attach
          gh issue view "$ISSUE" --json body,comments --jq '.body, .comments[].body' \
            | grep -oE 'https://github\.com/(user-attachments/files|[^ )]+/files)/[^ )"]+' \
            | sort -u | head -5 > /tmp/attach/urls.txt || true
          n=0
          while read -r u; do
            n=$((n+1)); curl -sSfL --max-filesize 120000000 -o "/tmp/attach/file$n.zip" "$u" || true
          done < /tmp/attach/urls.txt
          for f in /tmp/attach/*.zip; do
            [ -f "$f" ] && python3 tools/triage/vassal_extract.py "$f" --lines 60 > "$f.txt" 2>&1 || true
          done
          ls -la /tmp/attach

      - name: Triage with Claude
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          TRIAGE_PRODUCT: ${{ vars.TRIAGE_PRODUCT || 'the Congress of Vienna VASSAL module (GMT Games card-driven diplomacy and war game, 1813-1814)' }}
          TRIAGE_MODEL: ${{ vars.TRIAGE_MODEL || 'claude-sonnet-5-5' }}
          ANTHROPIC_FEDERATION_RULE_ID: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID || 'fdrl_014YuxMqH3yeizh92hGYexCM' }}
          ANTHROPIC_ORGANIZATION_ID: ${{ vars.ANTHROPIC_ORGANIZATION_ID || '0263bb2c-0d23-4d2c-89a3-5d9625a36b81' }}
          ANTHROPIC_SERVICE_ACCOUNT_ID: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID || 'svac_01UqXVWKTDUDny3ahZGSuNPf' }}
          ANTHROPIC_WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID || 'wrkspc_01QyBA7Poa9G58RN94kVsuwH' }}
        run: |
          pip install --quiet "anthropic>=2.3"
          python3 tools/triage/triage.py
